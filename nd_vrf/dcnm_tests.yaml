---
# This playbook can be used to execute integration tests for
# the roles located in:
#
# REPO_ROOT/tests/integration/targets/dcnm_vrf/tests/dcnm/*.yaml
#
# Either:
#
# 1. Modify the following:
#
#    - The vars section below with details for your testing setup.
#    - dcnm_hosts.yaml in this directory
#
# 2. Run the tests
#
#    ansible-playbook dcnm_tests.yaml -i dcnm_hosts.yaml
#
# OR:
#
# 1. Modify ../../files/dynamic_inventory.py to align with your setup
#
#    This must contain the vars mentioned below and controller
#    info from dcnm_hosts.yaml (modified for your setup)
#
#  2. Run the tests
#
#     ansible-playbook dcnm_tests.yaml -i ../../files/dynamic_inventory.py
#
#
- name: DCNM VRF Tests
  hosts: ndfc
  gather_facts: false
  connection: ansible.netcommon.httpapi
# Uncomment and modify if not using dynamic_inventory.py
# See the individual test yaml files for a description of
# how each var below is used in each test.  Some tests,
# for example, do not use interface_1.
#   vars:
    # standalone (non-msd) test vars
    # fabric_1: f1
    # switch_1: 192.168.1.2
    # switch_2: 192.168.1.3
    # switch_3: 192.168.1.4

    # multisite test vars
    # parent_fabric: pf1
    # child_fabric: cf1
    # child_switch_1: 192.168.1.2
    # child_switch_2: 192.168.1.3

    # common vars
    # interface_1: Ethernet1/1
    # interface_2a: Ethernet1/2
    # interface_3: Ethernet1/3

    ## Uncomment ONE of the following testcases

    # To run all tests under standalone,
    # testcase: standalone/*
    # To run individual standalone tests,
    # testcase: standalone/<test_name>
    # Example:
    # testcase: standalone/deleted

    # To run all tests under standalone/self-contained-tests,
    # testcase: standalone/self-contained-tests/*
    # To run individual self-contained tests,
    # testcase: standalone/self-contained-tests/<test_name>
    # Example:
    # testcase: standalone/self-contained-tests/scale

    # To run all tests under multisite,
    # testcase: msd/*
    # To run individual multisite tests,
    # testcase: msd/<test_name>
    # Example:
    # testcase: msd/sanity

    # To run all tests under multicluster,
    # testcase: mcfg/*
    # To run individual multicluster tests,
    # testcase: mcfg/<test_name>
    # Example:
    # testcase: mcfg/sanity

  # roles:
  #   - dcnm_vrf

  tasks:
    - name: Manage MSD Fabric VRFs in Nexus Dashboard
      cisco.nd.nd_vrf:
        fabric: AK-VXLAN
        # output_level: debug
        timeout: 30
        state: merged
        config:
        - vrf_name: ansible-vrf-aH
          # vrf_id: 9008012
          # vlan_id: 651
          vrf_vlan_name: ansible_vrf_allprops_vlan
          vrf_intf_desc: Ansible all properties VRF SVI
          vrf_int_mtu: 9216
          l3vni_wo_vlan: false
          vrf_description: Ansible all manageable properties test
          loopback_route_tag: 12345
          redist_direct_rmap: FABRIC-RMAP-REDIST-SUBNET
          v6_redist_direct_rmap: FABRIC-RMAP-REDIST-SUBNET
          max_bgp_paths: 4
          max_ibgp_paths: 4
          ipv6_linklocal_enable: true
          disable_rt_auto: true
          import_vpn_rt:
            - "65000:9008012"
          export_vpn_rt:
            - "65000:9008013"
          import_evpn_rt:
            - "65000:9008014"
          export_evpn_rt:
            - "65000:9008015"
          trm_enable: false
          no_rp: false
          rp_external: false
          trm_bgw_msite: false
          adv_host_routes: true
          adv_default_routes: false
          static_default_route: false
          bgp_password: abcdef12
          bgp_passwd_encrypt: 3
          netflow_enable: false
          nf_monitor: MON1
