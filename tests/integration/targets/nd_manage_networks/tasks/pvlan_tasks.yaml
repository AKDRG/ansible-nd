---
- name: PVLAN - Build Primary and Secondary Configurations
  ansible.builtin.set_fact:
    nd_network_pvlan_primary_config:
      - network_name: "{{ nd_network_pvlan_prefix }}-primary"
        network_id: "{{ nd_network_base_id | int + nd_network_pvlan_offset | int }}"
        vlan_id: "{{ nd_network_base_vlan | int + nd_network_pvlan_offset | int }}"
        vlan_name: ansible_nd_pvlan_primary
        layer: layer2
        vlan_network_type: primary
        deploy: false
    nd_network_pvlan_secondary_config:
      - network_name: "{{ nd_network_pvlan_prefix }}-community"
        network_id: "{{ nd_network_base_id | int + nd_network_pvlan_offset | int + 1 }}"
        vlan_id: "{{ nd_network_base_vlan | int + nd_network_pvlan_offset | int + 1 }}"
        vlan_name: ansible_nd_pvlan_community
        layer: layer2
        vlan_network_type: community
        primary_network_id: "{{ nd_network_base_id | int + nd_network_pvlan_offset | int }}"
        deploy: false
      - network_name: "{{ nd_network_pvlan_prefix }}-isolated"
        network_id: "{{ nd_network_base_id | int + nd_network_pvlan_offset | int + 2 }}"
        vlan_id: "{{ nd_network_base_vlan | int + nd_network_pvlan_offset | int + 2 }}"
        vlan_name: ansible_nd_pvlan_isolated
        layer: layer2
        vlan_network_type: isolated
        primary_network_id: "{{ nd_network_base_id | int + nd_network_pvlan_offset | int }}"
        deploy: false
    nd_network_pvlan_gather_config:
      - network_name: "{{ nd_network_pvlan_prefix }}-primary"
      - network_name: "{{ nd_network_pvlan_prefix }}-community"
      - network_name: "{{ nd_network_pvlan_prefix }}-isolated"
  delegate_to: localhost

- name: PVLAN - Prepare Primary Configuration
  vars:
    file: pvlan_primary
    network_conf: "{{ nd_network_pvlan_primary_config }}"
  ansible.builtin.import_tasks: conf_prep_tasks.yaml

- name: PVLAN - Prepare Secondary Configuration
  vars:
    file: pvlan_secondary
    network_conf: "{{ nd_network_pvlan_secondary_config }}"
  ansible.builtin.import_tasks: conf_prep_tasks.yaml

- name: PVLAN - Prepare Gather Configuration
  vars:
    file: pvlan_gather
    network_conf: "{{ nd_network_pvlan_gather_config }}"
  ansible.builtin.import_tasks: conf_prep_tasks.yaml

- name: PVLAN - Gather Fixture Names in Every Scope Before Creation
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ item }}"
    state: gathered
    config: "{{ nd_network_pvlan_gather_conf }}"
  loop: "{{ [target_fabric] + nd_network_pvlan_member_names }}"
  register: nd_network_pvlan_before

- name: PVLAN - Refuse Existing Fixture Names in Any Scope
  ansible.builtin.assert:
    that:
      - >-
        item.gathered | selectattr('network_name', 'in', nd_network_pvlan_gather_conf | map(attribute='network_name') | list) | list | length == 0
    fail_msg: "A PVLAN fixture already exists in {{ item.item }}; no existing Networks will be changed or removed."
  loop: "{{ nd_network_pvlan_before.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: PVLAN - Verify Definition Lifecycle
  block:
    - name: PVLAN - Create Primary First
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ target_fabric }}"
        state: merged
        config: "{{ nd_network_pvlan_primary_conf }}"
        output_level: debug
      register: nd_network_pvlan_primary_create

    - name: PVLAN - Create Community and Isolated Secondaries
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ target_fabric }}"
        state: merged
        config: "{{ nd_network_pvlan_secondary_conf }}"
        output_level: debug
      register: nd_network_pvlan_secondary_create

    - name: PVLAN - Require Actual Creation
      ansible.builtin.assert:
        that:
          - nd_network_pvlan_primary_create.changed
          - nd_network_pvlan_secondary_create.changed

    - name: PVLAN - Repeat Definitions in Merged and Replaced Normal and Check Mode
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ target_fabric }}"
        state: "{{ item.state }}"
        config: "{{ nd_network_pvlan_primary_conf + nd_network_pvlan_secondary_conf }}"
        output_level: debug
      check_mode: "{{ item.check }}"
      loop:
        - state: merged
          check: false
        - state: merged
          check: true
        - state: replaced
          check: false
        - state: replaced
          check: true
      register: nd_network_pvlan_repeats

    - name: PVLAN - Assert Definition Idempotence
      ansible.builtin.assert:
        that:
          - not item.changed
      loop: "{{ nd_network_pvlan_repeats.results }}"
      loop_control:
        label: "state={{ item.item.state }}, check_mode={{ item.item.check }}"

    - name: PVLAN - Verify Optional Attachments Without Explicit Deployment
      ansible.builtin.import_tasks: pvlan_attachment_tasks.yaml
      when: nd_network_run_pvlan_attach | bool

    - name: PVLAN - Read Controller Definitions in the Owning Fabric and Every Member
      cisco.nd.nd_rest:
        path: "/api/v1/manage/fabrics/{{ item[0] | urlencode }}/networks/{{ item[1].network_name | urlencode }}"
        method: get
      loop: "{{ ([target_fabric] + nd_network_pvlan_member_names) | product(nd_network_pvlan_primary_conf + nd_network_pvlan_secondary_conf) | list }}"
      loop_control:
        label: "{{ item[0] }}/{{ item[1].network_name }}"
      register: nd_network_pvlan_readback

    - name: PVLAN - Assert Parent and Member Types IDs VLANs and Associations
      ansible.builtin.assert:
        that:
          - item.jsondata.fabricName == item.item[0]
          - item.jsondata.networkName == item.item[1].network_name
          - item.jsondata.networkId | int == item.item[1].network_id | int
          - >-
            item.jsondata.get('vlanId', item.jsondata.get('networkTemplateConfig', {}).get('vlanId')) | int
            == item.item[1].vlan_id | int
          - >-
            item.jsondata.vlanNetworkType ==
            {'primary': 'privatePrimary', 'community': 'privateSecondaryCommunity', 'isolated': 'privateSecondaryIsolated'}[item.item[1].vlan_network_type]
          - >-
            item.item[1].vlan_network_type == 'primary' or
            item.jsondata.primaryNetworkId | int == item.item[1].primary_network_id | int
      loop: "{{ nd_network_pvlan_readback.results }}"
      loop_control:
        label: "{{ item.item[0] }}/{{ item.item[1].network_name }}"
  always:
    - name: PVLAN - Remove Only Test Secondaries Before Primary
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ target_fabric }}"
        state: deleted
        config: "{{ nd_network_pvlan_secondary_conf }}"

    - name: PVLAN - Remove Only Test Primary
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ target_fabric }}"
        state: deleted
        config: "{{ nd_network_pvlan_primary_conf }}"

    - name: PVLAN - Gather Every Scope After Cleanup
      cisco.nd.nd_manage_networks:
        fabric_name: "{{ item }}"
        state: gathered
        config: "{{ nd_network_pvlan_gather_conf }}"
      loop: "{{ [target_fabric] + nd_network_pvlan_member_names }}"
      register: nd_network_pvlan_after

    - name: PVLAN - Assert Fixture Removal in the Owning Fabric and Every Member
      ansible.builtin.assert:
        that:
          - >-
            item.gathered | selectattr('network_name', 'in', nd_network_pvlan_gather_conf | map(attribute='network_name') | list) | list | length == 0
      loop: "{{ nd_network_pvlan_after.results }}"
      loop_control:
        label: "{{ item.item }}"
