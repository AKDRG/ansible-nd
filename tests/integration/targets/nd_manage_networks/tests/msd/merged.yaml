---
- name: Test Entry Point - [nd_manage_networks - msd - merged]
  ansible.builtin.debug:
    msg:
      - "----------------------------------------------------------------"
      - "+     Executing MSD Merged Tests - [nd_manage_networks]          +"
      - "----------------------------------------------------------------"
  tags:
    - msd
    - merged

- name: MSD Merged - Build Parent and Child Network Config
  ansible.builtin.set_fact:
    target_fabric: "{{ nd_network_msd_parent_fabric }}"
    target_network_delete_config:
      - network_name: ansible-nd-net-msd-merged-switch
        layer: layer2
      - network_name: ansible-nd-net-msd-merged-resource
        layer: layer2
    nd_network_msd_merged_stage_config:
      - network_name: ansible-nd-net-msd-merged-switch
        layer: layer2
        network_id: "{{ nd_network_base_id + 201 }}"
        vlan_id: "{{ nd_network_base_vlan + 201 }}"
        vlan_name: ans_nd_net_msd_mrg_sw
        deploy: false
        deploy_type: switch
        attach: >-
          {{ [{'ip_address': nd_network_msd_switch, 'vlan_id': nd_network_base_vlan + 201, 'deploy': false}]
             if nd_network_run_msd_attach | bool else [] }}
        child_fabric_config:
          - fabric_name: "{{ nd_network_msd_child_fabric }}"
            multicast_group_address: 239.1.1.61
      - network_name: ansible-nd-net-msd-merged-resource
        layer: layer2
        network_id: "{{ nd_network_base_id + 202 }}"
        vlan_id: "{{ nd_network_base_vlan + 202 }}"
        vlan_name: ans_nd_net_msd_mrg_res
        deploy: false
        deploy_type: switch
        attach: >-
          {{ [{'ip_address': nd_network_msd_switch, 'vlan_id': nd_network_base_vlan + 202, 'deploy': false}]
             if nd_network_run_msd_attach | bool else [] }}
        child_fabric_config:
          - fabric_name: "{{ nd_network_msd_child_fabric }}"
            multicast_group_address: 239.1.1.62
    nd_network_msd_merged_deploy_config:
      - network_name: ansible-nd-net-msd-merged-switch
        layer: layer2
        network_id: "{{ nd_network_base_id + 201 }}"
        vlan_id: "{{ nd_network_base_vlan + 201 }}"
        vlan_name: ans_nd_net_msd_mrg_sw
        deploy: true
        deploy_type: switch
        attach: >-
          {{ [{'ip_address': nd_network_msd_switch, 'vlan_id': nd_network_base_vlan + 201, 'deploy': true}]
             if nd_network_run_msd_attach | bool else [] }}
        child_fabric_config:
          - fabric_name: "{{ nd_network_msd_child_fabric }}"
            multicast_group_address: 239.1.1.61
      - network_name: ansible-nd-net-msd-merged-resource
        layer: layer2
        network_id: "{{ nd_network_base_id + 202 }}"
        vlan_id: "{{ nd_network_base_vlan + 202 }}"
        vlan_name: ans_nd_net_msd_mrg_res
        deploy: true
        deploy_type: switch
        attach: >-
          {{ [{'ip_address': nd_network_msd_switch, 'vlan_id': nd_network_base_vlan + 202, 'deploy': true}]
             if nd_network_run_msd_attach | bool else [] }}
        child_fabric_config:
          - fabric_name: "{{ nd_network_msd_child_fabric }}"
            multicast_group_address: 239.1.1.62
  delegate_to: localhost
  tags:
    - msd
    - merged

- name: MSD Merged - Import Setup
  ansible.builtin.import_tasks: ../../tasks/setup.yaml
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged - Prepare Stage Configuration
  vars:
    file: msd_merged_stage
    network_conf: "{{ nd_network_msd_merged_stage_config }}"
  ansible.builtin.import_tasks: ../../tasks/conf_prep_tasks.yaml
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged - Prepare Deploy Configuration
  vars:
    file: msd_merged_deploy
    network_conf: "{{ nd_network_msd_merged_deploy_config }}"
  ansible.builtin.import_tasks: ../../tasks/conf_prep_tasks.yaml
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC1 - Stage Parent and Child Networks
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ target_fabric }}"
    state: merged
    config: "{{ nd_network_msd_merged_stage_conf }}"
    output_level: debug
  register: msd_merged_staged
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC1 - Assert Structured Stage Result
  ansible.builtin.assert:
    that:
      - msd_merged_staged.changed == true
      - msd_merged_staged.fabric_type == "multisite_parent"
      - >-
        msd_merged_staged.workflow ==
        "Multisite Parent with Child Fabric Processing"
      - msd_merged_staged.parent_fabric.fabric_type == "multisite_parent"
      - msd_merged_staged.child_fabrics | length == 1
      - >-
        msd_merged_staged.child_fabrics[0].fabric_name ==
        nd_network_msd_child_fabric
      - msd_merged_staged.child_fabrics[0].fabric_type == "multisite_child"
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC2 - Deploy Network Attachments
  cisco.nd.nd_manage_networks: &msd_merged_deploy_conf
    fabric_name: "{{ target_fabric }}"
    state: merged
    config: "{{ nd_network_msd_merged_deploy_conf }}"
    output_level: debug
  register: msd_merged_deployed
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC2 - Assert Deploy Result
  ansible.builtin.assert:
    that:
      - msd_merged_deployed.changed == (nd_network_run_msd_attach | bool)
      - msd_merged_deployed.child_fabrics | length == 1
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC2 - Read Deployed Attachments
  cisco.nd.nd_rest:
    path: "/api/v1/manage/fabrics/{{ target_fabric }}/networkAttachments/query?includeAll=true&max=10000&offset=0"
    method: post
    content:
      networkNames: "{{ nd_network_msd_merged_deploy_conf | map(attribute='network_name') | list }}"
  changed_when: false
  register: msd_merged_attachment_readback
  until:
    - msd_merged_attachment_readback.jsondata.attachments | selectattr('attach', 'equalto', true) | list | length == 2
    - >-
      msd_merged_attachment_readback.jsondata.attachments | selectattr('attach', 'equalto', true)
      | rejectattr('status', 'equalto', 'deployed') | list | length == 0
  retries: 30
  delay: 5
  when:
    - nd_network_run_msd | bool
    - nd_network_run_msd_attach | bool
    - msd_merged_deployed is succeeded
  tags: [msd, merged]

- name: MSD Merged TC2 - Assert Actual Deployment
  ansible.builtin.assert:
    that:
      - msd_merged_attachment_readback.jsondata.attachments | selectattr('attach', 'equalto', true) | list | length == 2
      - >-
        msd_merged_attachment_readback.jsondata.attachments | selectattr('attach', 'equalto', true) | map(attribute='networkName') | sort
        == nd_network_msd_merged_deploy_conf | map(attribute='network_name') | sort
      - >-
        msd_merged_attachment_readback.jsondata.attachments | selectattr('attach', 'equalto', true)
        | rejectattr('status', 'equalto', 'deployed') | list | length == 0
  when:
    - nd_network_run_msd | bool
    - nd_network_run_msd_attach | bool
    - msd_merged_deployed is succeeded
  tags: [msd, merged]

- name: MSD Merged TC3 - Gather Parent Networks
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ target_fabric }}"
    state: gathered
    config: "{{ nd_network_msd_merged_stage_conf }}"
  register: msd_merged_parent_gathered
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC3 - Validate Parent Networks
  cisco.nd.tests.integration._nd_network_validate:
    nd_data: "{{ msd_merged_parent_gathered }}"
    test_data: "{{ nd_network_msd_merged_stage_conf }}"
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC3 - Gather Child Networks
  cisco.nd.nd_manage_networks:
    fabric_name: "{{ nd_network_msd_child_fabric }}"
    state: gathered
    config: []
  register: msd_merged_child_gathered
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC3 - Validate Child Networks
  cisco.nd.tests.integration._nd_network_validate:
    nd_data: "{{ msd_merged_child_gathered }}"
    test_data:
      - network_name: ansible-nd-net-msd-merged-switch
        network_id: "{{ nd_network_base_id + 201 }}"
        vlan_id: "{{ nd_network_base_vlan + 201 }}"
        vlan_name: ans_nd_net_msd_mrg_sw
      - network_name: ansible-nd-net-msd-merged-resource
        network_id: "{{ nd_network_base_id + 202 }}"
        vlan_id: "{{ nd_network_base_vlan + 202 }}"
        vlan_name: ans_nd_net_msd_mrg_res
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC4 - Idempotence
  cisco.nd.nd_manage_networks: *msd_merged_deploy_conf
  register: msd_merged_idempotent
  when:
    - nd_network_run_msd | bool
    - not (nd_network_run_msd_attach | bool) or msd_merged_attachment_readback is succeeded
  tags:
    - msd
    - merged

- name: MSD Merged TC4 - Assert Idempotence
  ansible.builtin.assert:
    that:
      - msd_merged_idempotent.changed == false
  when: nd_network_run_msd | bool
  tags:
    - msd
    - merged

- name: MSD Merged TC4 - Check Repeat Idempotence
  cisco.nd.nd_manage_networks: *msd_merged_deploy_conf
  check_mode: true
  register: msd_merged_check_repeat
  when:
    - nd_network_run_msd | bool
    - not (nd_network_run_msd_attach | bool) or msd_merged_attachment_readback is succeeded
  tags: [msd, merged]

- name: MSD Merged TC4 - Assert Check Repeat Idempotence
  ansible.builtin.assert:
    that: [not msd_merged_check_repeat.changed]
  when: nd_network_run_msd | bool
  tags: [msd, merged]
