---
- name: Properties - Select Fabric Group VRF Scope
  ansible.builtin.set_fact:
    target_fabric: "{{ nd_vrf_msd_parent_fabric }}"
    nd_vrf_properties_child: "{{ nd_vrf_msd_child_fabric }}"
    nd_vrf_properties_prefix: ndvrf-gprops
  when: nd_vrf_run_msd | bool

- name: Properties - Exercise Parent and Child VRF Fields
  ansible.builtin.import_tasks: ../../tasks/properties_tasks.yaml
  when:
    - nd_vrf_run_msd | bool
    - nd_vrf_run_properties | bool
