---
- name: VRF Setup - Delete Only Test VRFs
  cisco.nd.nd_manage_vrfs:
    fabric_name: "{{ target_fabric }}"
    state: deleted
    config: >-
      {%- set entries = [] -%}
      {%- for name in target_vrf_names -%}
      {%- set _ = entries.append({'vrf_name': name, 'deploy': false}) -%}
      {%- endfor -%}
      {{ entries }}
  register: nd_vrf_cleanup_result
  when:
    - target_fabric is defined
    - target_fabric | length > 0
    - target_vrf_names is defined
    - target_vrf_names | length > 0
